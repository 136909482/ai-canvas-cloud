global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8787]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8790]

  - job_name: backup
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
