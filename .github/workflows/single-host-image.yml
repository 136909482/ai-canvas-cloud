name: Single-host quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Pin npm toolchain
        run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
